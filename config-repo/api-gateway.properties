server.port=8080
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
management.endpoints.web.exposure.include=gateway
management.endpoint.gateway.enabled=true

spring.cloud.gateway.routes[0].id=catalogue
spring.cloud.gateway.routes[0].uri=lb://service-catalogue
spring.cloud.gateway.routes[0].predicates[0]=Path=/products/**

spring.cloud.gateway.routes[1].id=utilisateurs
spring.cloud.gateway.routes[1].uri=lb://service-utilisateurs
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[2].id=commande
spring.cloud.gateway.routes[2].uri=lb://service-commande
spring.cloud.gateway.routes[2].predicates[0]=Path=/commandes/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[3].id=stock
spring.cloud.gateway.routes[3].uri=lb://service-stock
spring.cloud.gateway.routes[3].predicates[0]=Path=/stock/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[4].id=notification
spring.cloud.gateway.routes[4].uri=lb://service-notification
spring.cloud.gateway.routes[4].predicates[0]=Path=/notifications/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1

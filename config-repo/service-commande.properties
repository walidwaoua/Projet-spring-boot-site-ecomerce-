server.port=8083
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:service_commande}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:appuser}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:app_password}
spring.cloud.openfeign.client.config.default.connectTimeout=${FEIGN_CONNECT_TIMEOUT_MS:1000}
spring.cloud.openfeign.client.config.default.readTimeout=${FEIGN_READ_TIMEOUT_MS:2000}
spring.cloud.openfeign.client.config.default.loggerLevel=basic
v6.feign.retry.max-attempts=${FEIGN_RETRY_MAX_ATTEMPTS:2}
v6.feign.retry.wait-duration=${FEIGN_RETRY_WAIT:200ms}
v6.feign.circuit-breaker.sliding-window-size=${FEIGN_CIRCUIT_BREAKER_WINDOW:5}
v6.feign.circuit-breaker.minimum-number-of-calls=${FEIGN_CIRCUIT_BREAKER_MIN_CALLS:3}
v6.feign.circuit-breaker.failure-rate-threshold=${FEIGN_CIRCUIT_BREAKER_FAILURE_RATE:50}
v6.feign.circuit-breaker.open-wait-duration=${FEIGN_CIRCUIT_BREAKER_OPEN_WAIT:10s}

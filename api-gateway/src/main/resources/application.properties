server.port=8080
spring.application.name=api-gateway
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.routes[0].id=catalogue
spring.cloud.gateway.routes[0].uri=lb://service-catalogue
spring.cloud.gateway.routes[0].predicates[0]=Path=/catalogue/**
spring.cloud.gateway.routes[1].id=utilisateurs
spring.cloud.gateway.routes[1].uri=lb://service-utilisateurs
spring.cloud.gateway.routes[1].predicates[0]=Path=/utilisateurs/**
spring.cloud.gateway.routes[2].id=commande
spring.cloud.gateway.routes[2].uri=lb://service-commande
spring.cloud.gateway.routes[2].predicates[0]=Path=/commandes/**
spring.cloud.gateway.routes[3].id=stock
spring.cloud.gateway.routes[3].uri=lb://service-stock
spring.cloud.gateway.routes[3].predicates[0]=Path=/stock/**
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
